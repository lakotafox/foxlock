<!DOCTYPE html>
<html>
  <head><meta name="robots" content="noindex" /></head>
  <body>
    <!-- Netlify Forms detection for /sign. Submissions are POSTed here by src/app/sign/SignClient.tsx. -->
    <form name="foxlock-signature" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="foxlock-signature" />
      <input name="bot-field" />
      <input name="case_id" />
      <input name="signer_name" />
      <input name="signature_method" />
      <textarea name="signature_png"></textarea>
      <input name="signed_at" />
      <input name="timezone" />
      <input name="contract_version" />
      <input name="user_agent" />
    </form>
    <!-- Netlify Forms detection for /witness (same component, witness variant). -->

      <input name="share_messages" />

      <input name="share_contact" />
      <input name="account_check" />
      <input name="account_check_for" />
      <input name="name_in_packet" />
      <input name="case_id" />
      <input name="signer_name" />
      <input name="signature_method" />
      <textarea name="signature_png"></textarea>
      <input name="signed_at" />
      <input name="timezone" />
      <input name="contract_version" />
      <input name="user_agent" />
    </form>
    <!-- Netlify Forms detection for /email-consent (same component, email variant). -->

      <input type="hidden" name="form-name" value="foxlock-email-consent" />

      <input name="account_email" />
      <input name="search_sender" />
      <input name="search_mentions" />

      <input name="name_in_packet" />

      <textarea name="signature_png"></textarea>

      <input name="timezone" />

      <textarea name="signature_png"></textarea>
      <input name="signed_at" />
      <input name="timezone" />

      <input name="user_agent" />
    </form>
  </body>
</html>
